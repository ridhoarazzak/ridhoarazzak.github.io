<!DOCTYPE html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WebGIS Solok Selatan</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{--bg:#f4f5ef;--card:#fff;--tx:#16231b;--mu:#5b6a5f;--ln:#d8ddd2;--hd:#14301f;--ac:#1b6b00;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#10150f;--card:#1a221b;--tx:#e8efe6;--mu:#9aa99a;--ln:#2d382e;--hd:#0b1a10;--ac:#50c878}}
*{box-sizing:inherit}html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit}
header{background:var(--hd);color:#fff;padding:9px 14px;display:flex;align-items:center;gap:10px}
header h1{flex:1;margin:0;font-size:16px;line-height:1.2}header small{display:block;font-weight:400;font-size:12px;opacity:.7}
#lp{border:1px solid rgba(255,255,255,.45);background:none;color:#fff;border-radius:8px;padding:6px 12px}
main{flex:1;min-height:0;position:relative}
.pane{position:absolute;inset:0;display:none}.pane.on{display:block}
#map,iframe{width:100%;height:100%;border:0;display:block}
.fl{position:absolute;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;font-size:13px;z-index:2}
#lg{left:8px;top:8px;display:flex;flex-direction:column;gap:3px}#lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
#pn{right:8px;top:8px;width:210px;display:none;max-height:75%;overflow:auto}#pn.on{display:block}
#pn h3{margin:8px 0 4px;font-size:13px}#pn h3:first-child{margin-top:0}
#pn label{display:flex;align-items:center;gap:8px;padding:3px 0}
#sh{left:8px;right:8px;bottom:8px;max-height:46%;overflow:auto;display:none;border-radius:14px}#sh.on{display:block}
#sh h2{margin:0 28px 2px 0;font-size:17px}#sh .nt{color:var(--mu);font-size:12.5px}
#x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:22px;color:var(--mu);padding:4px 8px}
table{width:100%;border-collapse:collapse;margin-top:6px}td{padding:4px 0;border-bottom:1px solid var(--ln)}td:last-child{text-align:right;font-weight:600}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;margin:3px 0}.bar b{height:10px;background:#2f8f4e;border-radius:3px}.bar span:first-child{width:62px;color:var(--mu)}
nav{display:flex;background:var(--hd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:#b9c8bb;padding:12px 4px;font-size:13px;border-top:3px solid transparent}
nav button.on{color:#fff;font-weight:700;border-top-color:#f2c200}
:focus-visible{outline:2px solid #f2c200;outline-offset:2px}
</style></head><body>
<header><h1>WebGIS Solok Selatan<small>Solok Selatan Data Initiative</small></h1><button id="lp">Lapisan</button></header>
<main>
<section class="pane on" id="p-peta"><div id="map"></div>
<div class="fl" id="lg"></div>
<div class="fl" id="pn">
<h3>Peta dasar</h3>
<label><input type="radio" name="bm" value="osm" checked>Jalan</label>
<label><input type="radio" name="bm" value="sat">Satelit</label>
<label><input type="radio" name="bm" value="none">Polos</label>
<h3>Lapisan</h3>
<label><input type="checkbox" id="c-padi" checked>Sentra padi</label>
<label><input type="checkbox" id="c-3d">Tampilan 3D</label>
<label><input type="checkbox" id="c-jln" checked>Jalan (2.281 ruas)</label>
<label><input type="checkbox" id="c-bts" checked>Batas nagari</label>
</div>
<div class="fl" id="sh"><button id="x" aria-label="Tutup">×</button><div id="sc"></div></div>
</section>
<section class="pane" id="p-bisnis"><iframe id="f-bisnis" title="Peluang Bisnis" loading="lazy"></iframe></section>
<section class="pane" id="p-galodo"><iframe id="f-galodo" title="Simulasi Galodo" allow="fullscreen" loading="lazy"></iframe></section>
</main>
<nav><button data-t="peta" class="on">Peta padi</button><button data-t="bisnis">Peluang bisnis</button><button data-t="galodo">Simulasi galodo</button></nav>
